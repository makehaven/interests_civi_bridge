name: 'Interests CiviCRM Bridge'
type: module
description: 'Keeps Drupal member interest taxonomy selections in sync with a CiviCRM custom field.'
core_version_requirement: ^10 || ^11
package: Makerspace
dependencies:
  - drupal:civicrm
  - drupal:profile
  - drupal:taxonomy
  # The referral picker and its search endpoint live there; this form is where
  # the question is asked.
  - makerspace_referrals:makerspace_referrals
configure: interests_civi_bridge.settings
