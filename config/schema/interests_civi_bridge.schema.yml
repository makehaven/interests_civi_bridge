interests_civi_bridge.settings:
  type: config_object
  label: 'Interests CiviCRM Bridge settings'
  mapping:
    profile_bundle:
      type: string
      label: 'Profile bundle machine name'
    profile_field:
      type: string
      label: 'Profile field that stores taxonomy selections'
    civicrm_custom_field:
      type: string
      label: 'CiviCRM custom field column/name'
    enable_push:
      type: boolean
      label: 'Push Drupal changes to CiviCRM'
    enable_pull:
      type: boolean
      label: 'Pull changes from CiviCRM into Drupal'
